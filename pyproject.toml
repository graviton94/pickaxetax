[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pickaxetax"
version = "0.2.0"
description = "Pickaxe Tax: measure and cut wasted AI compute -- local LLM proxy, conversation skeletons, over-computation benchmark, Compute Bubble Index."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "tokens", "efficiency", "proxy", "openai", "anthropic", "benchmark", "sustainability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/graviton94/pickaxetax"
"Web app" = "https://graviton94.github.io/pickaxetax/"
Source = "https://github.com/graviton94/pickaxetax"
Issues = "https://github.com/graviton94/pickaxetax/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
tiktoken = ["tiktoken>=0.7"]

[project.scripts]
pickaxetax = "pickaxetax.cli:main"
pxt = "pickaxetax.cli:main"

[tool.setuptools.packages.find]
include = ["pickaxetax*"]

[tool.setuptools.package-data]
"pickaxetax.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
