[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickaxetax"
version = "0.1.0"
description = "Pickaxe Tax: measure and cut wasted AI compute -- local LLM proxy, conversation skeletons, over-computation benchmark, Compute Bubble Index."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tiktoken = ["tiktoken>=0.7"]

[project.scripts]
pickaxetax = "pickaxetax.cli:main"
pxt = "pickaxetax.cli:main"

[tool.setuptools.packages.find]
include = ["pickaxetax*"]

[tool.setuptools.package-data]
"pickaxetax.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
