<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- connect-src 'none': this page cannot send anything anywhere. Analysis runs in your browser. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Pickaxe Tax</title>
  <meta name="description" content="See how much compute your AI conversation didn't need. Runs entirely in your browser; nothing is uploaded.">
  <meta property="og:title" content="Pickaxe Tax — stop paying the pickaxe tax">
  <meta property="og:description" content="Your AI re-reads the whole conversation on every turn. See how much compute you didn't need. Runs in your browser; nothing is uploaded.">
  <meta property="og:image" content="https://graviton94.github.io/pickaxetax/og.png">
  <meta property="og:url" content="https://graviton94.github.io/pickaxetax/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1f7a5a">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">PICKAXE<span>TAX</span></a>
    <nav>
      <a href="https://github.com/graviton94/pickaxetax">GitHub</a>
      <button id="lang" class="ghost" type="button" aria-label="language">한국어</button>
    </nav>
  </header>

  <main>
    <section id="hero">
      <p class="kicker"><span data-i18n="kicker">Stop paying the pickaxe tax.</span> <b>#AntiTokenMaxing</b></p>
      <h1 data-i18n="hero_title">Your AI re-reads the whole conversation, every single turn.</h1>
      <p class="lede" data-i18n="hero_lede"></p>
      <p class="privacy-badge" data-i18n="badge">🔒 Runs in your browser. Nothing is uploaded.</p>
    </section>

    <section id="analyze" class="card">
      <form id="form">
        <label for="input" class="label" data-i18n="input_label"></label>
        <textarea id="input" rows="8" spellcheck="false" data-i18n-placeholder="input_ph"></textarea>
        <div class="row">
          <label class="file"><input type="file" id="file" accept=".json,.txt,.md"><span data-i18n="file_btn"></span> <em id="file-name"></em></label>
        </div>
        <div class="row end">
          <button type="button" class="ghost" id="sample" data-i18n="sample"></button>
          <button type="submit" id="go" data-i18n="analyze"></button>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </section>

    <section id="link" class="card linkbox">
      <h3 data-i18n="link_title"></h3>
      <ol>
        <li><span data-i18n="link_step1"></span> <a id="bookmarklet" class="bookmarklet" href="#">⛏ Pickaxe Tax</a></li>
        <li data-i18n="link_step2"></li>
        <li data-i18n="link_step3"></li>
      </ol>
      <p class="muted-box" data-i18n="link_note"></p>
    </section>

    <section id="result" hidden></section>

    <section id="impact" hidden>
      <h2 data-i18n="impact_title"></h2>
      <p class="muted" data-i18n="impact_lede"></p>
      <div class="grid" id="impact-stats"></div>
      <div class="card" id="impact-topics" hidden><h3 data-i18n="impact_topics"></h3><div class="chips" id="impact-chips"></div></div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer"></p>
    <p class="small"><a href="https://github.com/graviton94/pickaxetax">GitHub</a> · Apache-2.0 · <span data-i18n="engine_note"></span></p>
  </footer>
  <script src="config.js"></script>
  <script src="data/aggregate.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
