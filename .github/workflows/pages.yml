name: pages
# Static, local-first web app. Each build bakes the public aggregate of
# contributions into the site (no runtime fetch), and points the page's CSP
# at the contribution worker if one is deployed. Rebuilt daily.
on:
  push:
    paths: ["site/**", "pickaxetax/contrib*.py"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # deploy only from the repository's default branch (whatever it is named)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified contributions (if any)
        run: git clone --depth 1 --branch contributions "https://github.com/${{ github.repository }}.git" .contrib-data || mkdir -p .contrib-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bake config and public aggregate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -e .
          pxt contribute build-site --site site --data-dir .contrib-data | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
