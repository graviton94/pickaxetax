name: worker
# Deploys the anonymous contribution intake (Cloudflare Workers + D1, free tier).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skips cleanly without them.
on:
  push:
    paths: ["worker/**", "site/contrib.js", ".github/workflows/worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; anonymous contributions stay off. GitHub contributions still work."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: "22"
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          url=$(python3 deploy.py)
          echo "Worker: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: deploy
      - name: Smoke test the live worker (leaves no data)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -o pipefail
          node worker/test/smoke.mjs "${{ steps.deploy.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the site with the worker URL
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}" || echo "::notice::trigger pages manually"
