name: Bug report
description: Something measured wrong, crashed, or blocked your work.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, Coding agent audit / guard hook, Proxy, Benchmark, Contributions, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Please never paste private conversations or API keys. Redacted structure is enough.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `pxt --version`, or \"web app\"."
